name: Reusable Docker build, scan and publish steps
description: Scan the OCI build archive and publish the same image with its original digest.

inputs:
    push_to_ghcr:
        description: Whether to publish the image to GHCR
        required: true
    image_name:
        description: Image name without the registry and organization
        required: true
    github_token:
        description: GitHub token used when publishing to GHCR
        required: false
    dockerfile:
        description: Dockerfile for the image being built
        required: false
        default: Dockerfile
    image_tags:
        description: Explicit image tags for a versioned release
        default: ''
    image_labels:
        description: Explicit OCI labels for a versioned release
        default: ''

outputs:
    archive:
        description: Path to the scanned OCI archive in the current job.
        value: ${{ steps.scan.outputs.archive }}
    archive_digest:
        description: Immutable OCI index digest of the scanned image.
        value: ${{ steps.build.outputs.digest }}
    archive_sha256:
        description: Checksum of the scanned archive bytes.
        value: ${{ steps.scan.outputs.archive_sha256 }}
    digest:
        description: Immutable digest of the scanned and published image.
        value: ${{ steps.publish.outputs.digest }}

runs:
    using: 'composite'
    steps:
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Extract Metadata
          id: meta
          if: ${{ inputs.image_tags == '' }}
          uses: docker/metadata-action@v6
          with:
              images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}
              tags: |
                  type=sha
                  type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                  type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
                  type=raw,value=pre-dev,enable=${{ github.ref == 'refs/heads/pre-dev' }}

        # The OCI exporter retains the build action's default provenance.
        - name: Build the complete image without publishing
          id: build
          uses: docker/build-push-action@v7
          with:
              context: .
              file: ${{ inputs.dockerfile }}
              platforms: linux/amd64
              push: false
              outputs: type=oci,dest=${{ runner.temp }}/${{ inputs.image_name }}.tar
              labels: ${{ inputs.image_labels || steps.meta.outputs.labels }}
              # Separate app and Storybook build caches (Admin #424).
              cache-from: type=gha,scope=${{ inputs.image_name }}
              cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}

        - name: Install OCI transport
          shell: bash
          run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo

        - name: Install Trivy
          uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
          with:
              version: v0.70.0
              cache: true

        - name: Reject fixable high or critical image vulnerabilities
          id: scan
          shell: bash
          env:
              IMAGE_ARCHIVE: ${{ runner.temp }}/${{ inputs.image_name }}.tar
              IMAGE_PLATFORMS: linux/amd64
              EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          run: |
              bash "$GITHUB_ACTION_PATH/scan-image-archive.sh" "$IMAGE_ARCHIVE" "$IMAGE_PLATFORMS" "$EXPECTED_DIGEST"
              printf 'archive=%s\n' "$IMAGE_ARCHIVE" >> "$GITHUB_OUTPUT"

        - name: Login to GitHub Container Registry
          if: ${{ inputs.push_to_ghcr == 'true' }}
          uses: docker/login-action@v4
          with:
              registry: ${{ env.REGISTRY }}
              username: ${{ github.actor }}
              password: ${{ inputs.github_token }}

        - name: Publish the scanned archive without rebuilding
          id: publish
          if: ${{ inputs.push_to_ghcr == 'true' }}
          shell: bash
          env:
              IMAGE_ARCHIVE: ${{ steps.scan.outputs.archive }}
              IMAGE_TAGS: ${{ inputs.image_tags || steps.meta.outputs.tags }}
              EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
              EXPECTED_ARCHIVE_SHA256: ${{ steps.scan.outputs.archive_sha256 }}
          run: bash "$GITHUB_ACTION_PATH/publish-image-archive.sh" "$IMAGE_ARCHIVE" "$EXPECTED_DIGEST" "$EXPECTED_ARCHIVE_SHA256"
