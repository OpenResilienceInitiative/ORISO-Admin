name: Reusable Node Build steps

runs:
    using: 'composite'
    steps:
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
              # .nvmrc is the single source of truth for the Node version, shared with
              # local development (`nvm use` / `fnm use`) and declared again as
              # `engines.node` in package.json. Do NOT hardcode a version here: when CI
              # and developer machines drift apart, the suite fails locally in ways CI
              # never shows, and a red suite stops meaning anything.
              node-version-file: .nvmrc
              cache: npm

        - name: Install dependencies
          shell: bash
          # --ignore-scripts blocks arbitrary dependency postinstall scripts from
          # executing in CI (supply-chain hardening). Admin is a Vite app and does
          # not rely on any dependency lifecycle script to build.
          run: npm ci --ignore-scripts

        - name: Lint (ESLint, zero warnings)
          shell: bash
          run: npx eslint . --max-warnings=0

        - name: Lint (Stylelint)
          shell: bash
          # Check-only on purpose: `lint:css:fix` is the mutating variant and
          # must never run in CI.
          run: npm run lint:css

        - name: Check formatting (Prettier)
          shell: bash
          run: npx prettier . --check --ignore-unknown

        - name: Run unit tests
          shell: bash
          run: npm test

        - name: Build app
          shell: bash
          run: npm run build
