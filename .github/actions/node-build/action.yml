name: Reusable Node Build steps

inputs:
    node_version:
        required: true
        type: string

runs:
    using: 'composite'
    steps:
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
              node-version: ${{ inputs.node_version }}
              cache: npm

        - name: Install dependencies
          shell: bash
          # --ignore-scripts blocks arbitrary dependency postinstall scripts from
          # executing in CI (supply-chain hardening). Admin is a Vite app and does
          # not rely on any dependency lifecycle script to build.
          run: npm ci --ignore-scripts

        # src/components/IconCatalog/iconCatalog.generated.json has to stay
        # committed — ESLint resolves the Storybook page's import of it long
        # before `build-storybook` would generate it (#711) — so it rots
        # silently whenever a PR touches icon assets or icon references without
        # re-running the generator. The next contributor to start Storybook
        # then finds the drift in their own `git status` (#681 caused exactly
        # that). Catch it on the PR that introduces it instead. Runs before the
        # slower gates so a stale catalog fails in seconds.
        - name: Check the generated icon catalog is up to date
          shell: bash
          run: |
              set -euo pipefail
              npm run generate:icon-catalog
              if ! git diff --quiet; then
                echo "::error::The committed icon catalog is stale. Run 'npm run generate:icon-catalog' and commit the diff."
                git --no-pager diff --stat
                git --no-pager diff
                exit 1
              fi

        - name: Lint (ESLint, zero warnings)
          shell: bash
          run: npx eslint . --max-warnings=0

        - name: Lint (Stylelint)
          shell: bash
          # Check-only on purpose: `lint:css:fix` is the mutating variant and
          # must never run in CI.
          run: npm run lint:css

        - name: Check formatting (Prettier)
          shell: bash
          run: npx prettier . --check --ignore-unknown

        - name: Run unit tests
          shell: bash
          run: npm test

        - name: Build app
          shell: bash
          run: npm run build
