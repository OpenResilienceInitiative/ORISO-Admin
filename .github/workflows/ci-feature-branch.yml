name: CI - Feature Branch

on:
    push:
        branches-ignore:
            - main
            - dev
            - pre-dev

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Build frontend application
              uses: ./.github/actions/node-build

            - name: Build Storybook
              run: npm run build-storybook
