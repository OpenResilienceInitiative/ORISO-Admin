name: CI - Main

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - dev
            - pre-dev

env:
    REGISTRY: ghcr.io
    ORG: openresilienceinitiative

concurrency:
    # Never cancel on a protected branch: that run publishes.
    group: ci-main-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        # This job publishes to GHCR. The unit suite used to run inside it, so a
        # red test blocked the publish; keep that guarantee now that the suite
        # is its own job.
        needs: unit-tests
        runs-on: ubuntu-latest
        timeout-minutes: 45

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Build frontend application
              uses: ./.github/actions/node-build

            - name: Create and Publish Docker image
              id: publish
              uses: ./.github/actions/docker-build-push
              with:
                  push_to_ghcr: true
                  image_name: oriso-admin
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            # Guard against the stale-bundle class of failure (issue #424): the
            # image we just published must contain exactly the frontend bundle
            # this run built, not a cache-restored older one. Green CI + a fresh
            # image timestamp hid this before, so assert it explicitly. Inspect
            # the immutable digest, never the mutable :pre-dev tag — a concurrent
            # push could rewrite the tag between publish and pull.
            - name: Verify the published image contains the freshly built bundle
              shell: bash
              env:
                  DIGEST: ${{ steps.publish.outputs.digest }}
              run: |
                  set -euo pipefail
                  built="$(cd build/assets && ls index-*.js | head -n1)"
                  if [ -z "$built" ]; then
                    echo "::error::npm run build produced no build/assets/index-*.js"
                    exit 1
                  fi
                  if [ -z "${DIGEST}" ]; then
                    echo "::error::build step exposed no image digest to verify against"
                    exit 1
                  fi
                  ref="${REGISTRY}/${ORG}/oriso-admin@${DIGEST}"
                  docker pull -q "$ref"
                  shipped="$(docker run --rm --entrypoint sh "$ref" \
                    -c 'ls /usr/share/nginx/html/admin/assets/index-*.js' \
                    | xargs -n1 basename | head -n1)"
                  echo "built entry bundle:   ${built}"
                  echo "shipped entry bundle: ${shipped}"
                  if [ "${built}" != "${shipped}" ]; then
                    echo "::error::${ref} ships '${shipped}' but this run built '${built}' — stale bundle in image (issue #424)."
                    exit 1
                  fi

            - name: Reject fixable high or critical image vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.REGISTRY }}/${{ env.ORG }}/oriso-admin@${{ steps.publish.outputs.digest }}
                  format: table
                  exit-code: '1'
                  ignore-unfixed: true
                  vuln-type: os,library
                  severity: CRITICAL,HIGH

    # Split out of `build` and sharded: the suite is 407 jsdom files and was
    # 20 of the 24 minutes of that job, most of it module import cost paid once
    # per worker. Four shards run concurrently, so the wall clock is roughly a
    # quarter and a failure names the shard that owns it.
    unit-tests:
        name: Unit tests (shard ${{ matrix.shard }}/4)
        runs-on: ubuntu-latest
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              # Same supply-chain hardening as .github/actions/node-build.
              run: npm ci --ignore-scripts

            - name: Run unit tests
              run: npm run test:shard -- --shard=${{ matrix.shard }}/4
