name: CI - Main

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - dev
            - pre-dev

env:
    REGISTRY: ghcr.io
    ORG: openresilienceinitiative
    IMAGE_NAME: oriso-admin

concurrency:
    # Never cancel on a protected branch: that run publishes.
    group: ci-main-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        # This job publishes to GHCR. The unit suite used to run inside it, so a
        # red test blocked the publish; keep that guarantee now that the suite
        # is its own job.
        needs: unit-tests
        runs-on: ubuntu-latest
        timeout-minutes: 45

        permissions:
            contents: read
            packages: write

        outputs:
            digest: ${{ steps.publish.outputs.digest }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Build frontend application
              uses: ./.github/actions/node-build

            - name: Create and Publish Docker image
              id: publish
              uses: ./.github/actions/docker-build-push
              with:
                  push_to_ghcr: true
                  image_name: ${{ env.IMAGE_NAME }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            # Guard against the stale-bundle class of failure (issue #424): the
            # image we just published must contain exactly the frontend bundle
            # this run built, not a cache-restored older one. Green CI + a fresh
            # image timestamp hid this before, so assert it explicitly. Inspect
            # the immutable digest, never the mutable :pre-dev tag — a concurrent
            # push could rewrite the tag between publish and pull.
            - name: Verify the published image contains the freshly built bundle
              shell: bash
              env:
                  DIGEST: ${{ steps.publish.outputs.digest }}
              run: |
                  set -euo pipefail
                  built="$(cd build/assets && ls index-*.js | head -n1)"
                  if [ -z "$built" ]; then
                    echo "::error::npm run build produced no build/assets/index-*.js"
                    exit 1
                  fi
                  if [ -z "${DIGEST}" ]; then
                    echo "::error::build step exposed no image digest to verify against"
                    exit 1
                  fi
                  ref="${REGISTRY}/${ORG}/oriso-admin@${DIGEST}"
                  docker pull -q "$ref"
                  shipped="$(docker run --rm --entrypoint sh "$ref" \
                    -c 'ls /usr/share/nginx/html/admin/assets/index-*.js' \
                    | xargs -n1 basename | head -n1)"
                  echo "built entry bundle:   ${built}"
                  echo "shipped entry bundle: ${shipped}"
                  if [ "${built}" != "${shipped}" ]; then
                    echo "::error::${ref} ships '${shipped}' but this run built '${built}' — stale bundle in image (issue #424)."
                    exit 1
                  fi

    attest-dev:
        name: Sign the published Dev image
        if: github.ref == 'refs/heads/dev'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            id-token: write
            attestations: write

        steps:
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Attest the published Dev image
              uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
              with:
                  subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
                  subject-digest: ${{ needs.build.outputs.digest }}
                  push-to-registry: true
                  create-storage-record: false

    # Split out of `build` and sharded: the suite is 407 jsdom files and was
    # 20 of the 24 minutes of that job, most of it module import cost paid once
    # per worker. Four shards run concurrently, so the wall clock is roughly a
    # quarter and a failure names the shard that owns it.
    unit-tests:
        name: Unit tests (shard ${{ matrix.shard }}/4)
        runs-on: ubuntu-latest
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              # Same supply-chain hardening as .github/actions/node-build.
              run: |
                  npm ci --ignore-scripts
                  npm run prepare:runtime

            - name: Verify configured lint failure controls
              run: npm run test:lint-controls

            - name: Verify native unit teardown errors and healthy controls
              run: node scripts/verify-native-unit-errors.mjs

            - name: Verify unit timing sanitizer
              run: node --test scripts/write-unit-file-timings.nodecheck.mjs

            - name: Run unit tests
              env:
                  VERIFICATION_ARTIFACTS_DIR: verification-artifacts
                  ACCOUNT_INVITE_TRACE_FILE: verification-artifacts/account-invite-trace.jsonl
              run: npm run test:shard -- --shard=${{ matrix.shard }}/4 --reporter=json --outputFile.json="$RUNNER_TEMP/unit-raw.json"

            # Upload only file paths and elapsed times, never assertion output or test data.
            - name: Prepare unit file timings
              if: always()
              continue-on-error: true
              run: |
                  if [ -f "$RUNNER_TEMP/unit-raw.json" ]; then
                    node scripts/write-unit-file-timings.mjs "$RUNNER_TEMP/unit-raw.json" "$RUNNER_TEMP/unit-file-timings.json"
                  fi

            - name: Upload unit file timings
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: unit-file-timings-${{ matrix.shard }}
                  path: ${{ runner.temp }}/unit-file-timings.json
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Upload unit verification inventory
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: unit-verification-${{ matrix.shard }}
                  path: verification-artifacts/
                  if-no-files-found: warn
