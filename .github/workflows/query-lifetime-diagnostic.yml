name: Temporary query lifetime diagnostic

on:
    push:
        branches: [diagnostic/admin-query-lifetime-1611]

permissions:
    contents: read

concurrency:
    group: query-lifetime-diagnostic-${{ github.ref }}
    cancel-in-progress: true

jobs:
    query-lifetime:
        name: Six-case query lifetime evidence (not acceptance)
        runs-on: ubuntu-latest
        timeout-minutes: 12
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install without third-party lifecycle scripts
              run: |
                  npm ci --ignore-scripts
                  npm run prepare:runtime
            - name: Install Chromium
              run: npx playwright install --with-deps chromium
            - name: Run one closed six-case diagnostic
              env:
                  VERIFICATION_SOURCE_SHA: ${{ github.sha }}
              run: node scripts/diagnose-story-fixtures.mjs users-prefix-through-tenant
            - name: Preserve raw diagnostic evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: query-lifetime-users-prefix-through-tenant
                  path: verification-artifacts/
                  if-no-files-found: error
