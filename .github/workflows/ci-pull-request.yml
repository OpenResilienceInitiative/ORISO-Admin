name: CI - Pull Request

on:
    pull_request:

env:
    REGISTRY: ghcr.io
    ORG: openresilienceinitiative

concurrency:
    # A superseded pull-request head is not worth finishing.
    group: ci-pull-request-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Build frontend application
              uses: ./.github/actions/node-build

            - name: Build Storybook
              run: npm run build-storybook

            - name: Create Docker image
              uses: ./.github/actions/docker-build-push
              with:
                  push_to_ghcr: false
                  image_name: oriso-admin
                  github_token: ${{ secrets.GITHUB_TOKEN }}

    # Split out of `build` and sharded: the suite is 407 jsdom files and was
    # 20 of the 24 minutes of that job, most of it module import cost paid once
    # per worker. Four shards run concurrently, so the wall clock is roughly a
    # quarter and a failure names the shard that owns it.
    unit-tests:
        name: Unit tests (shard ${{ matrix.shard }}/4)
        runs-on: ubuntu-latest
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              # Same supply-chain hardening as .github/actions/node-build.
              run: |
                  npm ci --ignore-scripts
                  npm run prepare:runtime

            - name: Verify configured lint failure controls
              run: npm run test:lint-controls

            - name: Verify native unit teardown errors and healthy controls
              run: node scripts/verify-native-unit-errors.mjs

            - name: Run unit tests
              env:
                  VERIFICATION_SOURCE_SHA: ${{ github.sha }}
                  VERIFICATION_ARTIFACTS_DIR: verification-artifacts
                  ACCOUNT_INVITE_TRACE_FILE: verification-artifacts/account-invite-trace.jsonl
              run: npm run test:shard -- --shard=${{ matrix.shard }}/4

            - name: Upload unit verification inventory
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: unit-verification-${{ matrix.shard }}
                  path: verification-artifacts/
                  if-no-files-found: warn

    # Functional evidence retains rendering/play and integrity gates.
    # Compliance is DEFERRED/NOT_RUN here; strict diagnostics are independent.
    storybook-tests:
        name: Storybook functional verification (compliance deferred)
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              # Same supply-chain hardening as .github/actions/node-build.
              run: |
                  npm ci --ignore-scripts
                  npm run prepare:runtime

            - name: Install Chromium for Vitest browser mode
              # --ignore-scripts above skips Playwright's own postinstall, so the
              # browser has to be fetched explicitly. Chromium only — this suite
              # asserts behaviour and accessibility, not cross-browser rendering.
              run: npx playwright install --with-deps chromium

            - name: Generate icon catalogue
              # IconCatalog.stories.tsx reads the generated JSON; `prestorybook`
              # does this for the dev server, and the test project needs it too.
              run: npm run generate:icon-catalog

            - name: Verify functional controls and matched axe callsite witness
              id: functional_controls
              env:
                  VERIFICATION_SOURCE_SHA: ${{ github.sha }}
              run: npm run test:verification-controls:functional

            - name: Run full functional Storybook inventory
              # Keep controls failure red while collecting ordinary fixture evidence.
              if: ${{ !cancelled() && (steps.functional_controls.outcome == 'success' || steps.functional_controls.outcome == 'failure') }}
              env:
                  VERIFICATION_SOURCE_SHA: ${{ github.sha }}
              run: npm run test:storybook:functional

            - name: Upload Storybook verification evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: storybook-functional-verification
                  path: |
                      verification-artifacts/
                      coverage/
                      **/__screenshots__/
                  if-no-files-found: warn

    storybook-strict-diagnostic:
        name: Storybook strict20 diagnostic (independent)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install dependencies
              run: |
                  npm ci --ignore-scripts
                  npm run prepare:runtime
            - name: Install Chromium
              run: npx playwright install --with-deps chromium
            - name: Run strict20 capture, verify and shuffle diagnostics
              env:
                  VERIFICATION_SOURCE_SHA: ${{ github.sha }}
              run: npm run test:verification-controls
            - name: Upload separate strict diagnostic evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: storybook-strict20-diagnostic
                  path: verification-artifacts/
                  if-no-files-found: error

    storybook-functional-serial-comparison:
        name: Storybook functional serial-file comparison (same head)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install dependencies and prepare reviewed runtime
              run: |
                  npm ci --ignore-scripts
                  npm run prepare:runtime
            - name: Install Chromium
              run: npx playwright install --with-deps chromium
            - name: Generate icon catalogue
              run: npm run generate:icon-catalog
            - name: Run complete functional inventory with serial files
              env:
                  VERIFICATION_SOURCE_SHA: ${{ github.sha }}
              run: npm run test:storybook:functional -- --no-file-parallelism --isolate
            - name: Upload separate serial-file comparison evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: storybook-functional-serial-comparison
                  path: |
                      verification-artifacts/
                      **/__screenshots__/
                  if-no-files-found: error
