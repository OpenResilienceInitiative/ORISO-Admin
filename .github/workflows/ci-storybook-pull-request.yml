name: CI - Storybook Pull Request

on:
    pull_request:

env:
    REGISTRY: ghcr.io
    ORG: openresilienceinitiative

concurrency:
    # A superseded pull-request head is not worth finishing.
    group: ci-storybook-pull-request-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Create Storybook Docker image
              uses: ./.github/actions/docker-build-push
              with:
                  push_to_ghcr: false
                  image_name: oriso-admin-storybook
                  dockerfile: Dockerfile.storybook
                  github_token: ${{ secrets.GITHUB_TOKEN }}
