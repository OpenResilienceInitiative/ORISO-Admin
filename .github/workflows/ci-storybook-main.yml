name: CI - Storybook Main

on:
    push:
        branches:
            - main
            - dev
            - pre-dev

env:
    REGISTRY: ghcr.io
    ORG: openresilienceinitiative

concurrency:
    # Never cancel on a protected branch: that run publishes.
    group: ci-storybook-main-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Create and Publish Storybook Docker image
              uses: ./.github/actions/docker-build-push
              with:
                  push_to_ghcr: true
                  image_name: oriso-admin-storybook
                  dockerfile: Dockerfile.storybook
                  github_token: ${{ secrets.GITHUB_TOKEN }}
