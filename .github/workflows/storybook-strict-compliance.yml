name: Storybook full strict compliance (manual)

on:
    workflow_dispatch:

jobs:
    strict-compliance:
        name: Full strict compliance audit
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install dependencies
              run: |
                  npm ci --ignore-scripts
                  npm run prepare:runtime
            - name: Install Chromium
              run: npx playwright install --with-deps chromium
            - name: Generate icon catalogue
              run: npm run generate:icon-catalog
            - name: Run full strict compliance inventory
              env:
                  VERIFICATION_SOURCE_SHA: ${{ github.sha }}
              run: npm run test:storybook:strict
            - name: Upload raw strict compliance evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: storybook-full-strict-compliance
                  path: |
                      verification-artifacts/
                      **/__screenshots__/
                  if-no-files-found: error
